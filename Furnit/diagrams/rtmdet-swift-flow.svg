<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1120" viewBox="0 0 860 1120" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6470"/>
    </marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#1c1c1e}
      .sub{font-size:13px;fill:#6b7280}
      .box{rx:12;ry:12;stroke-width:1.5}
      .bt{font-size:15px;font-weight:600}
      .bs{font-size:11.5px}
      .cam{fill:#eef2f7;stroke:#94a3b8}
      .gpu{fill:#e7f7ec;stroke:#34c759}
      .ane{fill:#dff3e6;stroke:#1ea64a}
      .cpu{fill:#e9f0fb;stroke:#3b82f6}
      .data{fill:#f4f4f5;stroke:#a1a1aa}
      .disp{fill:#fdeede;stroke:#f59e0b}
      .star{fill:#b91c1c;font-size:11.5px;font-weight:700}
      .edge{stroke:#5b6470;stroke-width:1.6;fill:none}
      .legtxt{font-size:12px;fill:#374151}
    </style>
  </defs>

  <text x="32" y="40" class="title">RTMDet instance segmentation — iOS (Swift / Core ML)</text>
  <text x="32" y="60" class="sub">Live "brain" loop. RTMDetImageInference + FurnitureFitView. ★ = accelerated on ANE/GPU,  ☆ = scalar CPU.</text>

  <!-- legend -->
  <rect x="600" y="74" width="14" height="14" rx="3" class="ane"/><text x="620" y="86" class="legtxt">ANE/GPU</text>
  <rect x="690" y="74" width="14" height="14" rx="3" class="cpu"/><text x="710" y="86" class="legtxt">CPU</text>
  <rect x="752" y="74" width="14" height="14" rx="3" class="cam"/><text x="772" y="86" class="legtxt">camera/IO</text>

  <!-- boxes pitch 86, x=250 w=360 h=52 -->
  <g>
    <rect x="250" y="100" width="360" height="52" class="box cam"/>
    <text x="430" y="122" text-anchor="middle" class="bt">Camera frame</text>
    <text x="430" y="140" text-anchor="middle" class="bs">AVCaptureVideoDataOutput · BGRA · ~30fps · alwaysDiscardsLateVideoFrames</text>
  </g>
  <path class="edge" d="M430,152 L430,186" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="186" width="360" height="52" class="box cam"/>
    <text x="430" y="208" text-anchor="middle" class="bt">Frame gate</text>
    <text x="430" y="226" text-anchor="middle" class="bs">drop every frame while inferring · take the freshest · no queue</text>
  </g>
  <path class="edge" d="M430,238 L430,272" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="272" width="360" height="52" class="box gpu"/>
    <text x="430" y="294" text-anchor="middle" class="bt">Preprocess · resize → 640×640</text>
    <text x="430" y="312" text-anchor="middle" class="bs">shared CIContext + CVPixelBufferPool (GPU/Metal)</text>
  </g>
  <path class="edge" d="M430,324 L430,358" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="358" width="360" height="52" class="box cpu"/>
    <text x="430" y="380" text-anchor="middle" class="bt">Build input tensor</text>
    <text x="430" y="398" text-anchor="middle" class="bs">BGRA → NCHW · ImageNet mean/std normalize</text>
  </g>
  <path class="edge" d="M430,410 L430,444" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="444" width="360" height="52" class="box ane"/>
    <text x="430" y="466" text-anchor="middle" class="bt">★ Core ML predict — RTMDet-Ins backbone</text>
    <text x="430" y="484" text-anchor="middle" class="bs">.mlmodelc · computeUnits .cpuAndNeuralEngine (ANE)</text>
  </g>
  <path class="edge" d="M430,496 L430,530" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="530" width="360" height="52" class="box data"/>
    <text x="430" y="552" text-anchor="middle" class="bt">Raw heads</text>
    <text x="430" y="570" text-anchor="middle" class="bs">cls / bbox / kernel × {80,40,20} levels · + mask_feat [1,8,80,80]</text>
  </g>
  <path class="edge" d="M430,582 L430,616" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="616" width="360" height="52" class="box cpu"/>
    <text x="430" y="638" text-anchor="middle" class="bt">Decode candidates</text>
    <text x="430" y="656" text-anchor="middle" class="bs">per cell: argmax(logits) → sigmoid once · ≥ threshold</text>
  </g>
  <path class="edge" d="M430,668 L430,702" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="702" width="360" height="52" class="box cpu"/>
    <text x="430" y="724" text-anchor="middle" class="bt">Class-aware NMS</text>
    <text x="430" y="742" text-anchor="middle" class="bs">keep ≤ 6 detections (maxDetectionCount)</text>
  </g>
  <path class="edge" d="M430,754 L430,788" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="788" width="360" height="52" class="box cpu"/>
    <text x="430" y="810" text-anchor="middle" class="bt">☆ Mask head · buildRawMaskPlane</text>
    <text x="430" y="828" text-anchor="middle" class="bs">dynamic-conv MLP (10→8→8→1) per 80×80 px · scalar CPU</text>
  </g>
  <text x="624" y="818" class="star">← un-accelerated</text>
  <path class="edge" d="M430,840 L430,874" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="874" width="360" height="52" class="box cpu"/>
    <text x="430" y="896" text-anchor="middle" class="bt">Composite cutout · buildCombinedRawMaskImage</text>
    <text x="430" y="914" text-anchor="middle" class="bs">sample mask plane → full-resolution RGBA cutout</text>
  </g>
  <path class="edge" d="M430,926 L430,960" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="960" width="360" height="52" class="box disp"/>
    <text x="430" y="982" text-anchor="middle" class="bt">Display</text>
    <text x="430" y="1000" text-anchor="middle" class="bs">cutout composited over the 3D room (SharpRoom/GLB/Mesh/Model)</text>
  </g>

  <!-- loop arrow back to frame gate -->
  <path class="edge" d="M250,986 C120,986 120,212 250,212" marker-end="url(#arrow)"/>
  <text x="96" y="600" transform="rotate(-90 96,600)" class="sub">live loop (back-pressure: one inference at a time)</text>

  <!-- modes side note -->
  <g>
    <rect x="648" y="616" width="186" height="138" rx="10" fill="#fbfbfd" stroke="#d1d5db"/>
    <text x="660" y="638" class="bt" font-size="13">Modes (gate masks)</text>
    <text x="660" y="662" class="bs">identifyOnly — boxes only;</text>
    <text x="660" y="678" class="bs">maxMaskCount 0, skip head</text>
    <text x="660" y="700" class="bs">segmentPrimary — centered</text>
    <text x="660" y="716" class="bs">detection only (1 mask)</text>
    <text x="660" y="738" class="bs">segmentSelected — union of</text>
    <text x="660" y="754" class="bs">tapped pins (≤6 masks)</text>
  </g>
</svg>
