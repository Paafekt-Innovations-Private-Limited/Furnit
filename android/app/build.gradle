plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

def paafektUploadStoreFile = findProperty("PAAFEKT_UPLOAD_STORE_FILE") ?: System.getenv("PAAFEKT_UPLOAD_STORE_FILE")
def paafektUploadStorePassword = findProperty("PAAFEKT_UPLOAD_STORE_PASSWORD") ?: System.getenv("PAAFEKT_UPLOAD_STORE_PASSWORD")
def paafektUploadKeyAlias = findProperty("PAAFEKT_UPLOAD_KEY_ALIAS") ?: System.getenv("PAAFEKT_UPLOAD_KEY_ALIAS")
def paafektUploadKeyPassword = findProperty("PAAFEKT_UPLOAD_KEY_PASSWORD") ?: System.getenv("PAAFEKT_UPLOAD_KEY_PASSWORD")
def hasPaafektUploadSigning = paafektUploadStoreFile &&
        paafektUploadStorePassword &&
        paafektUploadKeyAlias &&
        paafektUploadKeyPassword

android {
    namespace 'com.furnit.android'
    compileSdk 36
    assetPacks = [":rtmdet_models", ":room_generation_models"]

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        // Store identity is Paafekt; permanent after first Play publish.
        // Kotlin code stays in the com.furnit.android namespace on purpose.
        applicationId "com.paafekt.android"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            if (hasPaafektUploadSigning) {
                storeFile file(paafektUploadStoreFile)
                storePassword paafektUploadStorePassword
                keyAlias paafektUploadKeyAlias
                keyPassword paafektUploadKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasPaafektUploadSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        pickFirst '**/libfbjni.so'
        pickFirst '**/libc++_shared.so'
    }

    // ABI split: build only arm64-v8a APK (much smaller; works on almost all modern phones).
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.5.7'

    // WebView asset loading for bundled Three.js helpers.
    implementation 'androidx.webkit:webkit:1.8.0'

    // CameraX.
    implementation 'androidx.camera:camera-core:1.5.3'
    implementation 'androidx.camera:camera-camera2:1.5.3'
    implementation 'androidx.camera:camera-lifecycle:1.5.3'
    implementation 'androidx.camera:camera-view:1.5.3'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ONNX Runtime for Android model inference.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'

    // RTMDet's FP16 LiteRT path runs the convolutional graph on the mobile GPU.
    // Keep the standalone delegate bundled so inference does not depend on Play Services state.
    implementation 'com.google.ai.edge.litert:litert:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu:1.4.2'
    implementation 'com.google.ai.edge.litert:litert-gpu-api:1.4.2'

    // SceneView for GLB/GLTF room rendering.
    implementation 'io.github.sceneview:sceneview:2.3.3'

    // ARCore is optional; manifest metadata keeps install support for non-AR devices.
    implementation 'com.google.ar:core:1.45.0'

    // Firebase.
    // BOM 33.16+ pulls Auth that depends on reCAPTCHA >= 18.4.0 (Play blocks older 18.1.2).
    implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    // Force patched reCAPTCHA even if a transitive dep tries to pull an older line.
    implementation 'com.google.android.recaptcha:recaptcha:18.6.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
