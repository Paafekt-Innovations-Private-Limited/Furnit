<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1320" viewBox="0 0 860 1320" font-family="-apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6470"/>
    </marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#1c1c1e}
      .sub{font-size:13px;fill:#6b7280}
      .box{rx:12;ry:12;stroke-width:1.5}
      .bt{font-size:15px;font-weight:600}
      .bs{font-size:11.5px}
      .cam{fill:#eef2f7;stroke:#94a3b8}
      .gpu{fill:#e7f7ec;stroke:#34c759}
      .ane{fill:#dff3e6;stroke:#1ea64a}
      .cpu{fill:#e9f0fb;stroke:#3b82f6}
      .data{fill:#f4f4f5;stroke:#a1a1aa}
      .disp{fill:#fdeede;stroke:#f59e0b}
      .star{fill:#b91c1c;font-size:11.5px;font-weight:700}
      .edge{stroke:#5b6470;stroke-width:1.6;fill:none}
      .legtxt{font-size:12px;fill:#374151}
    </style>
  </defs>

  <text x="32" y="40" class="title">RTMDet instance segmentation — iOS (Swift / Core ML)</text>
  <text x="32" y="60" class="sub">Live + Settings image-scan "brain" loop. RTMDetImageInference + FurnitureFitView. ★ = accelerated on ANE/GPU, ☆ = scalar CPU.</text>

  <!-- legend -->
  <rect x="600" y="74" width="14" height="14" rx="3" class="ane"/><text x="620" y="86" class="legtxt">ANE/GPU</text>
  <rect x="690" y="74" width="14" height="14" rx="3" class="cpu"/><text x="710" y="86" class="legtxt">CPU</text>
  <rect x="752" y="74" width="14" height="14" rx="3" class="cam"/><text x="772" y="86" class="legtxt">camera/IO</text>

  <!-- boxes pitch 86, x=250 w=360 h=52 -->
  <g>
    <rect x="250" y="100" width="360" height="52" class="box cam"/>
    <text x="430" y="122" text-anchor="middle" class="bt">Camera / still image frame</text>
    <text x="430" y="140" text-anchor="middle" class="bs">AVCapture BGRA live feed or Settings image scan UIImage</text>
  </g>
  <path class="edge" d="M430,152 L430,186" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="186" width="360" height="72" class="box cam"/>
    <text x="430" y="208" text-anchor="middle" class="bt">Frame gate + cadence</text>
    <text x="430" y="226" text-anchor="middle" class="bs">~5fps (200ms interval) · skip if placement active or thermal-critical</text>
    <text x="430" y="244" text-anchor="middle" class="bs">background/resign → stop · foreground → resume</text>
  </g>
  <path class="edge" d="M430,258 L430,292" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="292" width="360" height="52" class="box gpu"/>
    <text x="430" y="314" text-anchor="middle" class="bt">Preprocess · resize → 640×640</text>
    <text x="430" y="332" text-anchor="middle" class="bs">image input; BGR mean/std normalization lives in Core ML graph</text>
  </g>
  <path class="edge" d="M430,344 L430,378" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="378" width="360" height="52" class="box cpu"/>
    <text x="430" y="400" text-anchor="middle" class="bt">Input provider</text>
    <text x="430" y="418" text-anchor="middle" class="bs">prefer MLFeatureValue(image); multi-array fallback still supported</text>
  </g>
  <path class="edge" d="M430,430 L430,464" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="464" width="360" height="52" class="box ane"/>
    <text x="430" y="486" text-anchor="middle" class="bt">★ Core ML predict — RTMDet-Ins backbone</text>
    <text x="430" y="504" text-anchor="middle" class="bs">.mlmodelc · computeUnits .cpuAndNeuralEngine (ANE)</text>
  </g>
  <path class="edge" d="M430,516 L430,550" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="550" width="360" height="52" class="box data"/>
    <text x="430" y="572" text-anchor="middle" class="bt">Raw heads</text>
    <text x="430" y="590" text-anchor="middle" class="bs">cls / bbox / kernel × {80,40,20} levels · + mask_feat [1,8,160,160]</text>
  </g>
  <path class="edge" d="M430,602 L430,636" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="636" width="360" height="52" class="box cpu"/>
    <text x="430" y="658" text-anchor="middle" class="bt">Decode candidates</text>
    <text x="430" y="676" text-anchor="middle" class="bs">per cell: argmax(logits) → sigmoid once · ≥ threshold</text>
  </g>
  <path class="edge" d="M430,688 L430,722" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="722" width="360" height="52" class="box cpu"/>
    <text x="430" y="744" text-anchor="middle" class="bt">Confidence-first class-aware NMS</text>
    <text x="430" y="762" text-anchor="middle" class="bs">IoU suppression; maxDetectionCount optional (nil = uncapped)</text>
  </g>
  <path class="edge" d="M430,774 L430,808" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="808" width="360" height="52" class="box cpu"/>
    <text x="430" y="830" text-anchor="middle" class="bt">☆ Mask head · buildRawMaskPlane</text>
    <text x="430" y="848" text-anchor="middle" class="bs">dynamic-conv MLP (10→8→8→1) per 80×80 px · scalar CPU</text>
  </g>
  <text x="624" y="838" class="star">← un-accelerated</text>
  <path class="edge" d="M430,860 L430,894" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="894" width="360" height="52" class="box cpu"/>
    <text x="430" y="916" text-anchor="middle" class="bt">Mask affinity + pixel union</text>
    <text x="430" y="934" text-anchor="middle" class="bs">class-agnostic piece grouping; opaque RGBA union avoids fog</text>
  </g>
  <path class="edge" d="M430,946 L430,980" marker-end="url(#arrow)"/>

  <g>
    <rect x="250" y="980" width="360" height="72" class="box disp"/>
    <text x="430" y="1002" text-anchor="middle" class="bt">Display + gestures</text>
    <text x="430" y="1020" text-anchor="middle" class="bs">cutout over room; overlay owns two-finger pinch when mask is visible</text>
    <text x="430" y="1038" text-anchor="middle" class="bs">multi-select: independent overlays with per-item pan/pinch (Regime A)</text>
  </g>

  <!-- loop arrow back to frame gate -->
  <path class="edge" d="M250,1016 C110,1016 110,222 250,222" marker-end="url(#arrow)"/>
  <text x="86" y="620" transform="rotate(-90 86,620)" class="sub">live loop (~5fps · back-pressure: one inference at a time)</text>

  <!-- modes side note -->
  <g>
    <rect x="648" y="636" width="186" height="158" rx="10" fill="#fbfbfd" stroke="#d1d5db"/>
    <text x="660" y="658" class="bt" font-size="13">Modes (gate masks)</text>
    <text x="660" y="682" class="bs">identifyOnly — boxes only;</text>
    <text x="660" y="698" class="bs">mask build gated off</text>
    <text x="660" y="720" class="bs">segmentPrimary — centered</text>
    <text x="660" y="736" class="bs">detection only (1 mask)</text>
    <text x="660" y="758" class="bs">segmentSelected — fused</text>
    <text x="660" y="774" class="bs">pin masks + affinity graph</text>
    <text x="660" y="790" class="bs" font-style="italic">fullVideo — cluster bboxes</text>
  </g>

  <!-- thermal side note -->
  <g>
    <rect x="648" y="186" width="186" height="108" rx="10" fill="#fff5f5" stroke="#fca5a5"/>
    <text x="660" y="208" class="bt" font-size="13">Thermal backoff</text>
    <text x="660" y="230" class="bs">nominal/fair → 200ms</text>
    <text x="660" y="246" class="bs">serious → 400ms</text>
    <text x="660" y="262" class="bs">critical → pause inference</text>
    <text x="660" y="282" class="bs">placement → skip entirely</text>
  </g>
</svg>
