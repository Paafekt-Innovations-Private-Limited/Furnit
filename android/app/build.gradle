plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

// Keep Android Studio Run APKs installable. These files are conversion/debug variants
// or non-Android artifacts kept in assets for reference.
def unusedRuntimeModelAssetExcludes = [
        "yolo11l-seg.param",
        "yolo11l-seg.bin",
]

android {
    namespace 'com.furnit.android'
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    androidResources {
        ignoreAssetsPattern = unusedRuntimeModelAssetExcludes.join(':')
    }

    defaultConfig {
        applicationId "com.furnit.android"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
        pickFirst '**/libfbjni.so'
        pickFirst '**/libc++_shared.so'
    }

    // ABI split: build only arm64-v8a APK (much smaller; works on almost all modern phones).
    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'androidx.activity:activity-ktx:1.7.2'
    implementation 'androidx.fragment:fragment-ktx:1.5.7'

    // WebView asset loading for bundled Three.js helpers.
    implementation 'androidx.webkit:webkit:1.8.0'

    // CameraX.
    implementation 'androidx.camera:camera-core:1.2.3'
    implementation 'androidx.camera:camera-camera2:1.2.3'
    implementation 'androidx.camera:camera-lifecycle:1.2.3'
    implementation 'androidx.camera:camera-view:1.2.3'

    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // ONNX Runtime for Android model inference.
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.2'

    // SceneView for GLB/GLTF room rendering.
    implementation 'io.github.sceneview:sceneview:2.0.3'

    // ARCore is optional; manifest metadata keeps install support for non-AR devices.
    implementation 'com.google.ar:core:1.45.0'

    // Firebase.
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth-ktx'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
