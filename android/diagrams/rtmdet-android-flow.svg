<svg xmlns="http://www.w3.org/2000/svg" width="860" height="1020" viewBox="0 0 860 1020" font-family="Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5b6470"/>
    </marker>
    <style>
      .title{font-size:24px;font-weight:700;fill:#1c1c1e}
      .sub{font-size:13px;fill:#6b7280}
      .bt{font-size:15px;font-weight:600}
      .bs{font-size:11.5px}
      .cam{fill:#eef2f7;stroke:#94a3b8}
      .acc{fill:#e7f7ec;stroke:#16a34a}
      .cpu{fill:#e9f0fb;stroke:#3b82f6}
      .data{fill:#f4f4f5;stroke:#a1a1aa}
      .disp{fill:#fdeede;stroke:#f59e0b}
      .star{fill:#b91c1c;font-size:11.5px;font-weight:700}
      .edge{stroke:#5b6470;stroke-width:1.6;fill:none}
      .legtxt{font-size:12px;fill:#374151}
    </style>
  </defs>

  <text x="32" y="40" class="title">RTMDet instance segmentation — Android (Kotlin / ONNX Runtime)</text>
  <text x="32" y="60" class="sub">Live "brain" loop. FurnitureFitManager + SharpRoomActivity. ★ = ONNX Runtime EP,  ☆ = scalar Kotlin.</text>

  <rect x="560" y="74" width="14" height="14" rx="3" class="acc"/><text x="580" y="86" class="legtxt">ONNX RT (CPU/XNNPACK)</text>
  <rect x="730" y="74" width="14" height="14" rx="3" class="cpu"/><text x="750" y="86" class="legtxt">Kotlin CPU</text>

  <g><rect x="250" y="100" width="360" height="52" rx="12" class="cam"/>
    <text x="430" y="122" text-anchor="middle" class="bt">CameraX ImageAnalysis</text>
    <text x="430" y="140" text-anchor="middle" class="bs">STRATEGY_KEEP_ONLY_LATEST · ARCore or classic camera</text></g>
  <path class="edge" d="M430,152 L430,186" marker-end="url(#arrow)"/>

  <g><rect x="250" y="186" width="360" height="52" rx="12" class="cam"/>
    <text x="430" y="208" text-anchor="middle" class="bt">Frame gate</text>
    <text x="430" y="226" text-anchor="middle" class="bs">drop while isBrainInferenceRunning · analyze only the latest</text></g>
  <path class="edge" d="M430,238 L430,272" marker-end="url(#arrow)"/>

  <g><rect x="250" y="272" width="360" height="52" rx="12" class="cpu"/>
    <text x="430" y="294" text-anchor="middle" class="bt">Preprocess</text>
    <text x="430" y="312" text-anchor="middle" class="bs">resize → 640² (letterbox/stretch) · normalize → NCHW</text></g>
  <path class="edge" d="M430,324 L430,358" marker-end="url(#arrow)"/>

  <g><rect x="250" y="358" width="360" height="52" rx="12" class="acc"/>
    <text x="430" y="380" text-anchor="middle" class="bt">★ OrtSession.run — RTMDet-Ins backbone</text>
    <text x="430" y="398" text-anchor="middle" class="bs">rtmdet-ins-m-raw.onnx · loaded once, reused (singleton)</text></g>
  <path class="edge" d="M430,410 L430,444" marker-end="url(#arrow)"/>

  <g><rect x="250" y="444" width="360" height="52" rx="12" class="data"/>
    <text x="430" y="466" text-anchor="middle" class="bt">Raw heads + proto</text>
    <text x="430" y="484" text-anchor="middle" class="bs">cls / bbox / mask-coeffs per location · + mask prototypes</text></g>
  <path class="edge" d="M430,496 L430,530" marker-end="url(#arrow)"/>

  <g><rect x="250" y="530" width="360" height="52" rx="12" class="cpu"/>
    <text x="430" y="552" text-anchor="middle" class="bt">Parse detections</text>
    <text x="430" y="570" text-anchor="middle" class="bs">decode boxes/classes · confidence threshold</text></g>
  <path class="edge" d="M430,582 L430,616" marker-end="url(#arrow)"/>

  <g><rect x="250" y="616" width="360" height="52" rx="12" class="cpu"/>
    <text x="430" y="638" text-anchor="middle" class="bt">NMS + primary selection</text>
    <text x="430" y="656" text-anchor="middle" class="bs">class-aware NMS · centered-primary / pinned filter</text></g>
  <path class="edge" d="M430,668 L430,702" marker-end="url(#arrow)"/>

  <g><rect x="250" y="702" width="360" height="52" rx="12" class="cpu"/>
    <text x="430" y="724" text-anchor="middle" class="bt">☆ Mask build · coeffs · prototypes</text>
    <text x="430" y="742" text-anchor="middle" class="bs">dynamic conv (sigmoid(Σ coeff·proto)) per pixel · scalar Kotlin</text></g>
  <text x="624" y="732" class="star">← un-accelerated</text>
  <path class="edge" d="M430,754 L430,788" marker-end="url(#arrow)"/>

  <g><rect x="250" y="788" width="360" height="52" rx="12" class="cpu"/>
    <text x="430" y="810" text-anchor="middle" class="bt">Composite cutout</text>
    <text x="430" y="828" text-anchor="middle" class="bs">mask → bitmap cutout (union of selected instances)</text></g>
  <path class="edge" d="M430,840 L430,874" marker-end="url(#arrow)"/>

  <g><rect x="250" y="874" width="360" height="52" rx="12" class="disp"/>
    <text x="430" y="896" text-anchor="middle" class="bt">Display</text>
    <text x="430" y="914" text-anchor="middle" class="bs">cutout overlaid on the 3D room (WebView / SparkJS)</text></g>

  <path class="edge" d="M250,900 C120,900 120,212 250,212" marker-end="url(#arrow)"/>
  <text x="96" y="560" transform="rotate(-90 96,560)" class="sub">live loop (one inference at a time)</text>

  <g><rect x="648" y="530" width="186" height="124" rx="10" fill="#fbfbfd" stroke="#d1d5db"/>
    <text x="660" y="552" class="bt" font-size="13">Modes</text>
    <text x="660" y="576" class="bs">SEGMENT_PRIMARY — centered</text>
    <text x="660" y="592" class="bs">detection (auto, default)</text>
    <text x="660" y="614" class="bs">SEGMENT_SELECTED — union</text>
    <text x="660" y="630" class="bs">of tapped pins</text>
    <text x="660" y="648" class="bs">IDENTIFY_ONLY — tap to pick</text></g>
</svg>
